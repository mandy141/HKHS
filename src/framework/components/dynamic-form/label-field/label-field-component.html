<div *ngIf="inputFieldModel.controlType == ConstantAttributes.CONTROL_TYPE_LABEL" 
    [formGroup]="form" [class]="controlClass" [ngStyle]="toJSONObject(controlStyle)"   >
    <fieldset debug-field-set-spacing [style.border]="debugMode ? '' : 'none' " [style.border-color]="debugMode ? 'darkgreen' : ''">   
        <legend *ngIf="debugMode"><span debug-field-set-legend>{{inputFieldModel.key}}</span></legend>
        <ion-item transparent text-wrap no-lines [ngStyle]="toJSONObject(inputFieldModel.ionItemStyle)">                           
            <ion-label>
                <span *ngIf="!inputFieldModel.innerHTML" default-label-font [class]="inputFieldModel.labelClass" [ngStyle]="toJSONObject(inputFieldModel.labelStyle)">{{labelValue}}</span>
                <span *ngIf="inputFieldModel.innerHTML" default-label-font [class]="inputFieldModel.labelClass" [ngStyle]="toJSONObject(inputFieldModel.labelStyle)" [innerHTML]="labelValue"></span>
            </ion-label>            
        </ion-item>    
    </fieldset>       
</div>
