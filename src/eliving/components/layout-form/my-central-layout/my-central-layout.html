<!-- Themes Expandable Full image with CTA -->
<ion-header>
  <ion-navbar>
    <button ion-button menuToggle>
      <ion-icon name="custom-menu"></ion-icon>
    </button>
    <ion-title *ngIf="data">{{data.formTitle}}</ion-title>
    <ion-buttons end>
      <button ion-button icon-only (click)="onBackToHome()">
        <ion-icon name="custom-hsHome"></ion-icon>
      </button>
    </ion-buttons>
  </ion-navbar>
</ion-header>


<!-- Themes Centered with header -->
<ion-content after_login>
    <ion-grid no-padding *ngIf="data != null">
        <ion-row>
            <ion-col col-12 no-padding no-margin>
                <ion-list>
                    <!---HEADER-->
                    <ion-list-header no-margin no-padding no-lines background-size *ngIf="data.headerImage != null" [ngStyle]="{'background-image': 'url(' + data.headerImage + ')'}">
                        <h2 item-title text-center>{{data.title}}</h2>
                    </ion-list-header>
                    <!--CONTENT-->
                    <ul no-margin no-padding class="collapsible">
                        <li no-margin *ngFor="let group of data.groups;">
                            <!-- Expandable Centered with header Header-->
                            <div class="collapsible-header" no-margin no-padding (click)="toggleGroup(group)" style="background: url('../assets/eliving/logo_background/tab_background.png'); background-size: cover;">
                                <ion-item no-padding text-center no-lines cursor-pointer class="styleBackground">
                                    <ion-icon icon-small>
                                        <i class="icon {{group.icon}}"></i>
                                    </ion-icon>
                                    <h2 text-center item-title>{{group.title}}</h2>
                                </ion-item>
                            </div>
                            <!-- Expandable Centered with header Body -->
                           <div class="item-accordion" [style.height.px]="getGroupHeight(group)" [hidden]="!isGroupShown(group)">
                                  <ion-item full default-button no-lines cursor-pointer text-center *ngFor="let item of group.documents;" (click)="onItemClick(item.docURL)" [style.height.px]="item.height">
                                    <h2 setTop  text-center subitem-title>{{item.name}}   </h2> 
                                    <img [src]="item.image"  [hidden]="!item.image"/>         
                                </ion-item>
                            </div>
                            <!--end-->
                        </li>
                    </ul>
                </ion-list>
            </ion-col>
        </ion-row>
    </ion-grid>
</ion-content>
