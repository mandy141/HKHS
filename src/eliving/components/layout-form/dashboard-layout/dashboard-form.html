<ion-header>
  <ion-navbar>
      <button ion-button menuToggle>
        <ion-icon name="custom-menu"></ion-icon>
      </button>
      <ion-title *ngIf="data">{{data.formTitle}}</ion-title>
      <ion-buttons right>
          <button ion-button icon-only (click)="onBackToHome()">
            <ion-icon name="custom-hsHome"></ion-icon>
          </button>
        </ion-buttons>
        <ion-buttons end>
          <button styleBulb ion-button icon-only (click)="clickLife(data.headerIconLife)">
            <ion-icon name="custom-bulb_header" ></ion-icon>
          </button>
        </ion-buttons>
        <ion-buttons end>
          <button ion-button icon-only (click)="clickMgt(data.headerIconMgt)">
            <ion-icon name="custom-mgtOffice"></ion-icon>
          </button>
        </ion-buttons>
    </ion-navbar>
</ion-header>

  <ion-grid>
    <ion-row>
      <ion-col col-12 col-lg-3>
        <!-- Short Cut -->
        <ion-grid *ngIf="data">
            <ion-row>
                <ion-col col-6 col-lg-12 *ngFor="let item of data.shortcutItems;let i = index">
                  <ion-card box-shadow btn-shortcut-card-padding (click)="onShortcutItemClick(item)">

                      </ion-card-content>
                      <!--<button ion-button outline item-end icon-start>

                          Left Icon
                        </button>-->
                  </ion-card>
              </ion-col>
            </ion-row>
        </ion-grid>
      </ion-col>
      <ion-col col-12 col-lg-9>
        <!-- Dashboard Items -->
        <ion-grid *ngIf="data && data.dashboardItems && data.dashboardItems.length > 0">
            <ion-row >
                <ion-col col-12 no-padding no-margin *ngFor="let dashboardItem of data.dashboardItems;" dashboard-item-width>
                    <ion-list>
                        <ul no-margin no-padding class="collapsible">
                            <li margin >
                                <!-- Expandable Full image with CTA Header-->
                                <div class="collapsible-header">
                                    <!--<ion-item no-margin padding no-lines background-size [style.background-image]="'url(' + dashboardItem.backgroundImage + ')'" >-->
                                      <ion-item no-margin padding no-lines background-size dash_item_bar>
                                        <h2 item-title float-left>{{dashboardItem.title}}</h2>
                                        <button ion-button float-right button-clear-outline outline round (click)="onDashboardItemClick(dashboardItem.openForm)">
                                            {{dashboardItem.button}}
                                      </button>
                                    </ion-item>
                                </div>
                                <!-- Expandable Full image with CTA Body -->
                                <div class="item-accordion" [style.height.px]="getGroupHeight(dashboardItem)">
                                    <ion-item full default-button *ngFor="let item of dashboardItem.records;" [style.height.px]="item.height" 
                                    [attr.cursor-pointer]="item.openDtlForm || (item.fileURL && item.fileURL.length > 0) ? '' : null"
                                    (click)="onDashboardRecordClick(item)">
                                        <h2 subitem-title>{{item.desc}}</h2>
                                        <ion-icon *ngIf="item.fileURL && item.fileURL.length > 0" item-end>
                                          <i class="icon {{dashboardItem.iconFile}}"></i>
                                        </ion-icon>
                                        <ion-icon *ngIf="item.openDtlForm" item-end>
                                          <i class="icon {{dashboardItem.iconForm}}"></i>
                                        </ion-icon>
                                    </ion-item>
                                </div>
                                <!--end-->
                            </li>
                        </ul>
                    </ion-list>
                </ion-col>
            </ion-row>
        </ion-grid> 
      </ion-col>
    </ion-row>
  </ion-grid>     
</ion-content>
